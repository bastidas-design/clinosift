<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — ClinoSift</title>
<link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="auth-body">
<main class="auth-wrap">
  <div class="auth-card auth-card-wide">
    <img src="assets/images/logo.svg" alt="" width="64" height="64" class="auth-logo">
    <h1>Crear cuenta</h1>
    <p class="auth-sub">El registro público siempre crea una cuenta de paciente.</p>

    <form class="auth-form" id="registroForm">
      <div class="form-grid">
        <div class="form-row">
          <label for="nombres">Nombres</label>
          <input type="text" id="nombres" required>
        </div>
        <div class="form-row">
          <label for="apellidos">Apellidos</label>
          <input type="text" id="apellidos" required>
        </div>
      </div>

      <label for="documento">Número de documento</label>
      <input type="text" id="documento" required>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" minlength="6" required>

      <p class="auth-error" id="authError" hidden></p>

      <div class="auth-actions">
        <button type="submit" class="btn btn-primary btn-block">Crear cuenta de paciente</button>
        <a href="login.html" class="btn btn-ghost btn-block">Ya tengo cuenta</a>
      </div>
    </form>
  </div>
</main>

<script src="assets/js/db.js"></script>
<script>
  document.getElementById('registroForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var errorEl = document.getElementById('authError');

    var datos = {
      nombres: document.getElementById('nombres').value.trim(),
      apellidos: document.getElementById('apellidos').value.trim(),
      documento: document.getElementById('documento').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    };

    var resultado = window.ClinoDB.registrarPaciente(datos);
    if (!resultado.ok) {
      errorEl.textContent = resultado.error;
      errorEl.hidden = false;
      return;
    }
    window.location.href = 'paciente/dashboard.html';
  });
</script>
</body>
</html>
