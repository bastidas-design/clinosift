<h1>Crear cuenta</h1>

<p class="auth-sub">
  El registro público siempre crea una cuenta de paciente.

<form class="auth-form" id="registroForm">

  <div class="form-grid">

    <div class="form-row">
      <label for="nombres">Nombres</label>
      <input
        type="text"
        id="nombres"
        required
      >
    </div>

    <div class="form-row">
      <label for="apellidos">Apellidos</label>
      <input
        type="text"
        id="apellidos"
        required
      >
    </div>

  </div>

  <label for="tipoDocumento">Tipo de documento</label>

  <select id="tipoDocumento" required>
    <option value="cedula">Cédula de ciudadanía</option>
    <option value="tarjeta">Tarjeta de identidad</option>
    <option value="pasaporte">Pasaporte</option>
  </select>

  <label for="documento">Número de documento</label>

  <input
    type="text"
    id="documento"
    placeholder="Ingrese su número"
    required
  >

  <label for="email">Correo electrónico</label>

  <input
    type="email"
    id="email"
    placeholder="Ingrese su correo"
    required
  >

  <label for="password">Contraseña</label>

  <input
    type="password"
    id="password"
    placeholder="Ingrese su contraseña"
    minlength="6"
    required
  >

  <p class="auth-error" id="authError" hidden></p>

  <div class="auth-actions">

    <button
      type="submit"
      class="btn btn-primary btn-block"
    >
      Crear cuenta
    </button>

    <a
      href="login.html"
      class="btn btn-ghost btn-block"
    >
      Ya tengo cuenta
    </a>

  </div>

</form>

<script src="assets/js/db.js"></script>

<script src="assets/js/api.js"></script>

<script>
document.getElementById('registroForm').addEventListener('submit', async function (e) {
  e.preventDefault();

  var errorEl = document.getElementById('authError');
  var submitBtn = this.querySelector('button[type="submit"]');

  errorEl.textContent = '';
  errorEl.hidden = true;

  var datos = {
    nombres: document.getElementById('nombres').value.trim(),
    apellidos: document.getElementById('apellidos').value.trim(),
    tipoDocumento: document.getElementById('tipoDocumento').value,
    documento: document.getElementById('documento').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  };

  if (
    !datos.nombres ||
    !datos.apellidos ||
    !datos.tipoDocumento ||
    !datos.documento ||
    !datos.email ||
    !datos.password
  ) {
    errorEl.textContent = 'Complete todos los campos.';
    errorEl.hidden = false;
    return;
  }

  submitBtn.disabled = true;

  try {
    var resultado = await window.ClinoAuth.registrar(datos);

    if (!resultado.ok) {
      errorEl.textContent = resultado.error;
      errorEl.hidden = false;
      return;
    }

    window.location.href = 'paciente/dashboard.html';

  } catch (error) {
    errorEl.textContent = 'No se pudo completar el registro. Verifique que el backend esté funcionando.';
    errorEl.hidden = false;

  } finally {
    submitBtn.disabled = false;
  }
});
</script>
