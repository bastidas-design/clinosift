<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — ClinoSift</title>
<link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="auth-body">
<main class="auth-wrap">
<div class="auth-card">
<img src="assets/images/logo.svg" alt="" width="64" height="64" class="auth-logo">
<h1>ClinoSift</h1>
<p class="auth-sub">Sistema de Gestión Médica</p>
<form class="auth-form" id="loginForm">
<label for="tipoDocumento">Tipo de documento</label>
<select id="tipoDocumento" name="tipoDocumento" required>
<option value="cedula">Cédula de ciudadanía</option>
<option value="tarjeta">Tarjeta de identidad</option>
<option value="pasaporte">Pasaporte</option>
</select>
<label for="documento">Número de documento</label>
<input type="text" id="documento" name="documento" placeholder="Ingrese su número" autocomplete="username" required >
<label for="password">Contraseña</label>
<input type="password" id="password" name="password" placeholder="Ingrese su contraseña" autocomplete="current-password" required >
<p class="auth-error" id="authError" hidden></p>
<div class="auth-actions">
<button type="submit" class="btn btn-primary btn-block" id="loginBtn"> Iniciar sesión </button>
<a href="registro.html" class="btn btn-ghost btn-block"> Registrarme </a>
</div>
<a href="recuperar.html" class="auth-forgot"> Olvidé mi contraseña </a>
</form>
</div>
</main>
<script src="assets/js/api.js"></script>
<script> (function () { const loginForm = document.getElementById('loginForm'); const errorEl = document.getElementById('authError'); const loginBtn = document.getElementById('loginBtn'); loginForm.addEventListener('submit', async function (e) { e.preventDefault(); errorEl.textContent = ''; errorEl.hidden = true; const tipoDocumento = document.getElementById('tipoDocumento').value; const documento = document.getElementById('documento').value.trim(); const password = document.getElementById('password').value; if (!tipoDocumento || !documento || !password) { errorEl.textContent = 'Complete todos los campos.'; errorEl.hidden = false; return; } loginBtn.disabled = true; loginBtn.textContent = 'Iniciando sesión...'; try { const resultado = await window.ClinoAuth.login( tipoDocumento, documento, password ); if (!resultado.ok) { errorEl.textContent = resultado.error; errorEl.hidden = false; return; } const usuario = resultado.usuario; if (usuario.rol === 'paciente') { window.location.href = 'paciente/dashboard.html'; return; } if (usuario.rol === 'medico') { window.location.href = 'medico/dashboard.html'; return; } if (usuario.rol === 'admin') { errorEl.textContent = 'El panel de administrador aún no está disponible.'; errorEl.hidden = false; window.ClinoAuth.logout(); return; } errorEl.textContent = 'Rol de usuario no válido.'; errorEl.hidden = false; } catch (error) { console.error(error); errorEl.textContent = 'No se pudo completar el inicio de sesión. Verifique que el backend esté funcionando.'; errorEl.hidden = false; } finally { loginBtn.disabled = false; loginBtn.textContent = 'Iniciar sesión'; } }); })(); </script>
</body>
</html>
